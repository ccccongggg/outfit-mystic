<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手机外壳模拟器 · 可交互原型（雾紫神谕）</title>
<!--
  ==========================================================================
  手机外壳模拟器 / Phone Shell Simulator
  --------------------------------------------------------------------------
  · 外壳：圆角机身 + 金属边框高光 + 侧边按键 + 灵动岛 + 状态栏 + Home 指示条
  · 屏幕：独立滚动容器（overscroll-behavior:contain，滚动不外溢）
  · 交互：底部 Tab 切换 / 左右滑动翻页 / 二级页面 push-pop / 按压反馈 / 灵动岛通知
  · 自适应：JS 等比缩放（--scale），窄屏与矮屏都不溢出

  要换成你自己的界面，只动两处：
    1) HTML 里 <div class="pages"> 中的 <section class="page"> —— 每个 section 一屏
    2) JS 里的 DATA（数据）与 render*（页面渲染函数）
  外壳层（.phone .screen .statusbar .tabbar）和 JS 的「外壳交互」段都不用改。
  ==========================================================================
-->
<style>
  :root{
    /* ---- 机身尺寸（iPhone 14/15 比例 390×844）---- */
    --pw: 390px;          /* 屏+壳宽 */
    --ph: 844px;          /* 屏+壳高 */
    --bezel: 11px;        /* 黑边宽度 */
    --r-outer: 58px;      /* 机身圆角 */
    --r-screen: 47px;     /* 屏幕圆角 */
    --scale: 1;

    /* ---- 设计令牌（雾紫神谕 Mystic Oracle）---- */
    --cream:#FAF8F5; --surface:#FFFFFF; --mist:#E9E1F7; --lilac:#CDBBEE;
    --primary:#5B40CB; --primary-deep:#4630A8; --gold:#C9A86A;
    --night:#211A38; --night-2:#2E2450; --ink:#2A2438; --muted:#A9A5B8;
    --line:rgba(42,36,56,.08);
    --sh-card:0 8px 24px rgba(91,64,203,.09);
    --sh-card-2:0 14px 34px rgba(91,64,203,.16);
    --ease:cubic-bezier(.22,.61,.36,1);
    --font-serif:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
    --font-sans:"HarmonyOS Sans SC","MiSans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:
      radial-gradient(1200px 700px at 50% -10%, #2A2340 0%, transparent 60%),
      radial-gradient(700px 500px at 90% 100%, #3A2A55 0%, transparent 60%),
      #14111D;
    font-family:var(--font-sans); color:#EDE9F5; padding:24px 16px 40px;
  }

  /* ============ 舞台 & 缩放槽位 ============ */
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .slot{width:var(--pw);height:var(--ph);display:flex;align-items:center;justify-content:center}
  .scaler{width:var(--pw);height:var(--ph);transform:scale(var(--scale));transform-origin:center center;flex:none}
  .hint{
    max-width:560px;text-align:center;font-size:12.5px;line-height:1.9;color:#9B93B4;letter-spacing:.2px
  }
  .hint b{color:#D9D2EC;font-weight:600}
  .hint kbd{
    display:inline-block;padding:1px 6px;margin:0 2px;border-radius:5px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);font-family:var(--font-sans);font-size:11px;color:#D9D2EC
  }

  /* ============ 机身 ============ */
  .phone{
    position:relative;width:var(--pw);height:var(--ph);border-radius:var(--r-outer);
    background:
      linear-gradient(160deg,#4A4658 0%,#22202C 18%,#17151F 50%,#23212E 82%,#403C4E 100%);
    box-shadow:
      0 2px 3px rgba(255,255,255,.35) inset,
      0 -2px 3px rgba(255,255,255,.14) inset,
      0 0 0 1.5px rgba(10,9,14,.9),
      0 40px 80px -20px rgba(0,0,0,.75),
      0 10px 24px -8px rgba(0,0,0,.5);
  }
  /* 边框高光 */
  .phone::after{
    content:"";position:absolute;inset:0;border-radius:var(--r-outer);pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 74%,rgba(255,255,255,.12) 100%);
    mix-blend-mode:screen;
  }
  /* 侧边按键 */
  .btn-side{position:absolute;background:linear-gradient(180deg,#3A3648,#211F2A);box-shadow:0 1px 1px rgba(255,255,255,.25) inset,0 -1px 1px rgba(0,0,0,.6) inset}
  .btn-side.silent{left:-2.5px;top:132px;width:3px;height:30px;border-radius:2px}
  .btn-side.vol-up{left:-3px;top:186px;width:3.5px;height:58px;border-radius:2px}
  .btn-side.vol-dn{left:-3px;top:252px;width:3.5px;height:58px;border-radius:2px}
  .btn-side.power{right:-3px;top:214px;width:3.5px;height:92px;border-radius:2px}

  /* ============ 屏幕 ============ */
  .screen{
    position:absolute;inset:var(--bezel);border-radius:var(--r-screen);overflow:hidden;
    background:var(--cream);display:flex;flex-direction:column;isolation:isolate;
    box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 0 22px rgba(0,0,0,.5) inset;
  }
  /* 玻璃反光（不挡点击） */
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
    background:linear-gradient(112deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%);
  }

  /* ---- 灵动岛 ---- */
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:50;
    width:118px;height:33px;border-radius:20px;background:#08070C;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 0 0 .5px rgba(255,255,255,.06);
    transition:width .42s var(--ease),height .42s var(--ease),border-radius .42s var(--ease);
    overflow:hidden;
  }
  .island .cam{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2C3A55,#0A0A12 70%);flex:none;transition:opacity .2s}
  .island .itxt{
    font-size:12px;color:#F1EDF8;letter-spacing:.3px;white-space:nowrap;opacity:0;transform:translateY(4px);
    transition:opacity .28s var(--ease) .06s,transform .28s var(--ease) .06s;max-width:0
  }
  .island.expanded{width:212px}
  .island.expanded .itxt{opacity:1;transform:none;max-width:170px}
  .island.expanded .cam{opacity:.25}

  /* ---- 状态栏 ---- */
  .statusbar{
    position:relative;z-index:40;flex:none;height:52px;padding:15px 26px 0;
    display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;
    color:var(--ink);letter-spacing:.2px;transition:color .3s var(--ease)
  }
  .screen.theme-dark .statusbar{color:#F3EFFA}
  .statusbar .sb-right{display:flex;align-items:center;gap:6px}
  .statusbar svg{display:block}

  /* ============ 页面轨道（横向翻页） ============ */
  .pages{
    position:relative;flex:1;display:flex;width:400%;min-height:0;
    transform:translateX(calc(var(--i,0) * -25%));
    transition:transform .36s var(--ease);
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
  }
  .pages img{-webkit-user-drag:none}
  .pages.dragging{transition:none}
  .page{width:25%;height:100%;min-height:0;display:flex;flex-direction:column;background:var(--cream)}
  .page[data-page="oracle"]{background:var(--night)}
  .page-body{
    flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:4px 0 20px;
  }
  .page-body::-webkit-scrollbar{width:0;height:0}

  /* ============ 二级页面（push/pop） ============ */
  .overlay{
    position:absolute;inset:0;z-index:45;background:var(--cream);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .38s var(--ease);box-shadow:-8px 0 30px rgba(0,0,0,.12)
  }
  .overlay.open{transform:translateX(0)}
  .overlay.theme-dark{background:var(--night)}
  .ov-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 24px}
  .ov-body::-webkit-scrollbar{width:0}
  .navbar{
    flex:none;height:52px;display:flex;align-items:center;gap:6px;padding:0 10px;
    border-bottom:1px solid var(--line);background:var(--cream)
  }
  .overlay.theme-dark .navbar{background:var(--night);border-bottom-color:rgba(255,255,255,.08)}
  .navbar .nb-title{flex:1;text-align:center;font-family:var(--font-serif);font-size:16px;color:var(--ink);font-weight:700}
  .overlay.theme-dark .navbar .nb-title{color:#F3EFFA}
  .icon-btn{
    width:38px;height:38px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:var(--primary);cursor:pointer;transition:transform .16s var(--ease),background .2s
  }
  .icon-btn:active{transform:scale(.9);background:rgba(91,64,203,.08)}
  .overlay.theme-dark .icon-btn{color:var(--gold)}

  /* ============ 底部 Tab & Home 条 ============ */
  .tabbar{
    flex:none;position:relative;z-index:40;height:66px;display:flex;align-items:flex-start;padding-top:8px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)
  }
  .screen.theme-dark .tabbar{background:rgba(23,18,40,.92);border-top-color:rgba(255,255,255,.08)}
  .tab{
    flex:1;border:0;background:transparent;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--muted);font-size:10.5px;font-family:var(--font-sans);transition:color .24s var(--ease),transform .18s var(--ease)
  }
  .tab svg{width:23px;height:23px;display:block}
  .tab .tlabel{letter-spacing:.2px}
  .tab.active{color:var(--primary)}
  .screen.theme-dark .tab{color:#8F88A6}
  .screen.theme-dark .tab.active{color:var(--gold)}
  .tab:active{transform:scale(.94)}
  .tab-ind{
    position:absolute;top:2px;left:0;width:26px;height:3px;border-radius:2px;background:var(--primary);
    transition:transform .36s var(--ease),background .3s
  }
  .screen.theme-dark .tab-ind{background:var(--gold)}
  .homebar{
    flex:none;height:22px;display:flex;align-items:center;justify-content:center;background:inherit
  }
  .homebar i{display:block;width:138px;height:5px;border-radius:3px;background:rgba(42,36,56,.28)}
  .screen.theme-dark .homebar i{background:rgba(255,255,255,.42)}

  /* ============ 内容通用组件 ============ */
  .pad{padding:0 20px}
  .serif{font-family:var(--font-serif)}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 20px 12px}
  .sec h2{margin:0;font-family:var(--font-serif);font-size:17px;color:var(--ink);font-weight:700;letter-spacing:.5px}
  .sec span{font-size:11.5px;color:var(--muted)}
  .card{background:var(--surface);border-radius:22px;box-shadow:var(--sh-card);padding:16px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;font-size:12px;
    background:var(--mist);color:#4C3E86;border:1px solid transparent;cursor:pointer;transition:all .2s var(--ease)
  }
  .chip.on{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(91,64,203,.28)}
  .chip:active{transform:scale(.95)}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:18px;
    font-size:15px;font-weight:600;font-family:var(--font-sans);cursor:pointer;transition:transform .18s var(--ease),box-shadow .24s
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px rgba(91,64,203,.32)}
  .btn-ghost{background:transparent;color:var(--primary);border:1.5px solid rgba(91,64,203,.32)}
  .btn:active{transform:scale(.975)}
  .press{transition:transform .18s var(--ease)}
  .press:active{transform:scale(.965)}

  /* ---- 首页 ---- */
  .hello{display:flex;align-items:center;justify-content:space-between;margin:6px 20px 18px}
  .hello .kick{font-size:11.5px;color:var(--muted);letter-spacing:1.4px}
  .hello h1{margin:6px 0 0;font-family:var(--font-serif);font-size:25px;color:var(--ink);font-weight:700;letter-spacing:1px}
  .avatar{
    width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,var(--lilac),var(--primary));color:#fff;font-family:var(--font-serif);font-size:17px;
    box-shadow:0 8px 18px rgba(91,64,203,.26)
  }
  .hero{
    margin:0 20px;padding:22px 20px 20px;border-radius:28px;position:relative;overflow:hidden;
    background:linear-gradient(150deg,#F3EFFB 0%,var(--mist) 55%,#DED3F5 100%);box-shadow:var(--sh-card-2)
  }
  .hero .orn{position:absolute;right:-16px;top:-18px;width:120px;height:120px;opacity:.5}
  .hero p{margin:0 0 4px;font-family:var(--font-serif);font-size:19px;color:#3A2C6B;letter-spacing:.6px}
  .hero small{display:block;color:#6E63A0;font-size:12px;margin-bottom:16px}
  .hero .btns{display:flex;flex-direction:column;gap:10px}
  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
  .entry{
    border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:16px 14px;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-card)
  }
  .entry .ei{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--mist);color:var(--primary)}
  .entry b{font-size:14px;color:var(--ink);font-weight:600}
  .entry small{font-size:11px;color:var(--muted);line-height:1.5}
  .hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x mandatory}
  .hscroll::-webkit-scrollbar{height:0}
  .hs-item{flex:none;width:96px;scroll-snap-align:start}
  .hs-item .im{height:96px;border-radius:18px;background:#fff;overflow:hidden;box-shadow:var(--sh-card);display:flex;align-items:center;justify-content:center}
  .hs-item .im img{width:100%;height:100%;object-fit:contain}
  .hs-item small{display:block;margin-top:7px;font-size:11px;color:var(--muted);text-align:center}
  .today{display:flex;align-items:center;gap:12px;margin:0 20px 20px;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--sh-card);cursor:pointer}
  .today .thumbs{display:flex;gap:6px}
  .today .thumbs i{width:38px;height:38px;border-radius:11px;background:var(--mist);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .today .thumbs img{width:100%;height:100%;object-fit:contain}

  /* ---- 衣橱 ---- */
  .filter-row{display:flex;gap:8px;padding:2px 20px 14px;overflow-x:auto}
  .filter-row::-webkit-scrollbar{height:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
  .tile{
    background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--sh-card);cursor:pointer;
    display:flex;flex-direction:column
  }
  .tile .im{height:132px;background:#FFF;display:flex;align-items:center;justify-content:center;position:relative}
  .tile .im img{width:100%;height:100%;object-fit:contain}
  .tile .mt{padding:10px 12px 12px}
  .tile .mt b{display:block;font-size:13px;color:var(--ink);font-weight:600}
  .tile .mt .tg{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .tile .mt .tg span{font-size:10px;color:#6E63A0;background:var(--mist);border-radius:6px;padding:2px 7px}
  .tile.add .im{background:var(--mist);color:var(--primary);font-size:26px;font-weight:300}
  .tile.add .mt b{color:var(--primary)}

  /* ---- 神谕（仪式层） ---- */
  .oracle-wrap{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:14px 20px 0;text-align:center;overflow:hidden}
  .stars{position:absolute;inset:0;pointer-events:none;opacity:.85;
    background:
      radial-gradient(1.6px 1.6px at 18% 22%, #FFF 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 72% 14%, #F0E6FF 50%, transparent 51%),
      radial-gradient(1.8px 1.8px at 38% 62%, #FFF 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 86% 44%, #E9DCFF 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 52%, #FFF 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 60% 78%, #F6EEFF 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 92% 68%, #FFF 50%, transparent 51%),
      radial-gradient(1.1px 1.1px at 26% 88%, #E9DCFF 50%, transparent 51%);
    animation:twinkle 4.5s ease-in-out infinite alternate
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:.95}}
  .oracle-wrap .kick{margin-top:8px;font-size:11px;letter-spacing:3px;color:var(--gold);opacity:.85}
  .oracle-wrap h2{margin:12px 0 6px;font-family:var(--font-serif);font-size:23px;color:#F3EFFA;font-weight:700;letter-spacing:1.4px;line-height:1.55}
  .oracle-wrap .sub{font-size:12px;color:#A79FC4;margin-bottom:18px}
  .fan{position:relative;width:100%;height:240px;display:flex;align-items:center;justify-content:center;margin-top:6px}
  .tcard{
    position:absolute;width:124px;height:180px;cursor:pointer;perspective:1200px;
    transition:transform .55s var(--ease),opacity .4s var(--ease)
  }
  .tcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--ease)}
  .tcard.flipped .inner{transform:rotateY(180deg)}
  .tcard .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)}
  .tcard .back{background:linear-gradient(150deg,#3A2E63,#211A38);border:1px solid rgba(201,168,106,.42);display:flex;align-items:center;justify-content:center}
  .tcard .back svg{width:64px;height:64px;opacity:.9}
  .tcard .front{transform:rotateY(180deg);background:#15121F;display:flex;align-items:center;justify-content:center}
  .tcard .front img{width:100%;height:100%;object-fit:cover}
  .reveal{margin-top:6px;min-height:104px}
  .reveal .rname{font-family:var(--font-serif);font-size:19px;color:var(--gold);letter-spacing:2px}
  .reveal .rstory{font-size:12.5px;color:#CFC7E4;margin:8px 0 12px;line-height:1.7}
  .reveal .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .reveal .chips span{font-size:10.5px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#D8D0EB;border:1px solid rgba(255,255,255,.12)}
  .o-btn{
    margin-top:16px;width:100%;height:50px;border:0;border-radius:18px;cursor:pointer;font-size:15px;font-weight:600;
    background:linear-gradient(120deg,var(--gold),#E4C98C);color:#2A2036;box-shadow:0 12px 26px rgba(201,168,106,.28)
  }
  .o-btn:active{transform:scale(.975)}
  .o-again{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.18);color:#CFC7E4;height:44px;border-radius:16px;width:100%;font-size:13px;cursor:pointer}

  /* ---- 结果页 ---- */
  .res-band{padding:18px 20px 22px;background:linear-gradient(160deg,var(--night) 0%,var(--night-2) 100%);color:#F3EFFA}
  .res-band .rk{font-size:10.5px;letter-spacing:2.6px;color:var(--gold)}
  .res-band h2{margin:10px 0 8px;font-family:var(--font-serif);font-size:20px;letter-spacing:1px}
  .res-band p{margin:0;font-size:12.5px;line-height:1.8;color:#CFC7E4}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px;margin-top:-12px}
  .slot-c{background:var(--surface);border-radius:22px;box-shadow:var(--sh-card);overflow:hidden}
  .slot-c .im{height:120px;background:#fff;display:flex;align-items:center;justify-content:center}
  .slot-c .im img{width:100%;height:100%;object-fit:contain}
  .slot-c .lb{padding:9px 10px 11px;text-align:center}
  .slot-c .lb b{display:block;font-size:12.5px;color:var(--ink);font-weight:600}
  .slot-c .lb small{display:block;margin-top:3px;font-size:10.5px;color:var(--muted)}
  .reason{margin:18px 20px 0;padding:16px;border-radius:22px;background:var(--mist)}
  .reason .rl{font-size:11px;letter-spacing:1.6px;color:#6E63A0}
  .reason p{margin:8px 0 0;font-size:13px;line-height:1.85;color:#3F3568}

  /* ---- 我的 ---- */
  .me-head{display:flex;align-items:center;gap:14px;padding:22px 20px 18px}
  .me-head .av{width:58px;height:58px;border-radius:20px;background:linear-gradient(150deg,var(--lilac),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-serif);font-size:21px;box-shadow:0 10px 22px rgba(91,64,203,.28)}
  .me-head b{display:block;font-size:17px;color:var(--ink)}

/* 推荐引擎（与 web/engine.js 同构：硬筛季节/禁用色，软分必须色+风格，逐槽位取最高分） */
function recommend(items, c){
  const cats = c.must_categories || ["top","bottom","shoes"];
  let cand = items.filter(it => it && it.category);
  cand = cand.filter(it => !c.season || !c.season.length || !it.season || !it.season.length || it.season.some(s => c.season.includes(s)));
  cand = cand.filter(it => !(c.avoid_colors || []).some(k => {
    const n = it.color_name || "";
    return n && (n.includes(k) || k.includes(n));
  }));
  const scoreOf = it => {
    let s = 0;
    (c.must_colors || []).forEach(k => { const n = it.color_name || ""; if (n && (n.includes(k) || k.includes(n))) s += 3; });
    (c.style_tags || []).forEach(t => { if ((it.style_tags || []).includes(t)) s += 2; });
    return s + Math.random() * 0.01;
  };
  const ids = [];
  cats.forEach(cat => {
    const slot = cand.filter(it => it.category === cat).sort((a,b) => scoreOf(b) - scoreOf(a));
    if (slot[0]) ids.push(slot[0].id);
  });
  return ids;
}

/* 上传：抠图难度判定（与 web/app.js 同逻辑，采样四边白像素占比） */
function analyzeCut(img){
  const w = 64, h = Math.max(1, Math.round(img.height * 64 / img.width));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  let d;
  try { d = ctx.getImageData(0, 0, w, h).data; } catch (e) { return { hard:false }; }
  const at = (x, y) => { const i = (y * w + x) * 4; return d[i] > 240 && d[i+1] > 240 && d[i+2] > 240; };
  let total = 0, white = 0;
  const band = Math.max(1, Math.floor(Math.min(w, h) * 0.12));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x < band || x >= w - band || y < band || y >= h - band) { total++; if (at(x, y)) white++; }
  }
  const ratio = total ? white / total : 0;
  return { hard: ratio < 0.6, ratio };
}

/* ---- 事件委托：所有交互都走 data-act ---- */

/* ---- 左右滑动翻页（含拖拽跟手） ---- */
(function(){
  const pages = $("#pages");
  let x0 = 0, y0 = 0, dx = 0, dragging = false, horiz = false, w = 390;
  pages.addEventListener("pointerdown", e => {
    if (S.ov) return;
    dragging = true; horiz = false; dx = 0;
    x0 = e.clientX; y0 = e.clientY; w = $("#screen").clientWidth;
  });
  pages.addEventListener("pointermove", e => {
    if (!dragging) return;
    const ddx = e.clientX - x0, ddy = e.clientY - y0;
    if (!horiz) {
      if (Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)) { horiz = true; pages.classList.add("dragging"); }
      else if (Math.abs(ddy) > 10) { dragging = false; return; }
    }
    if (horiz) {
      dx = ddx;
      const i = TABS.indexOf(S.tab);
      let p = -i * w + dx * 0.85;
      const min = -(TABS.length - 1) * w, max = 0;
      if (p > max) p = max - (p - max) * -0.35;
      if (p < min) p = min + (min - p) * -0.35;
      pages.style.transition = "none";
      pages.style.transform = "translateX(" + p + "px)";
    }
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    pages.classList.remove("dragging");
    pages.style.transition = "";
    pages.style.transform = "";
    if (horiz && Math.abs(dx) > 56) {
      const i = TABS.indexOf(S.tab);
      const n = dx < 0 ? Math.min(TABS.length - 1, i + 1) : Math.max(0, i - 1);
      if (n !== i) setTab(TABS[n]);
    }
    dx = 0;
  };
  pages.addEventListener("pointerup", end);
  pages.addEventListener("pointercancel", end);
  pages.addEventListener("pointerleave", end);
})();

/* ---- 键盘：← → 切页，Esc 返回 ---- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (S.ov) closeOverlay(); else $("#sheetWrap").classList.remove("show"); return; }
  if (S.ov) return;
  const i = TABS.indexOf(S.tab);
  if (e.key === "ArrowRight" && i < TABS.length - 1) setTab(TABS[i + 1]);
  if (e.key === "ArrowLeft"  && i > 0) setTab(TABS[i - 1]);
});

/* ---- 状态栏时钟 ---- */
function tickClock(){
  const d = new Date();
  $("#clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}
tickClock(); setInterval(tickClock, 15000);

/* ---- 自适应缩放：桌面居中，窄屏/矮屏等比缩小不溢出 ---- */
const PW = 390, PH = 844;
function fit(){
  const s = Math.min(1, (window.innerWidth - 32) / PW, (window.innerHeight - 150) / PH);
  const v = Math.max(0.42, s);
  $(".scaler").style.setProperty("--scale", v);
  $("#slot").style.width = Math.round(PW * v) + "px";
  $("#slot").style.height = Math.round(PH * v) + "px";
}
window.addEventListener("resize", fit);

/* ---- 启动 ---- */
renderAll();
setTab("home", true);
fit();
setTimeout(() => Phone.island("Mystic Oracle 已就绪"), 700);
</script>
</body>
</html>
