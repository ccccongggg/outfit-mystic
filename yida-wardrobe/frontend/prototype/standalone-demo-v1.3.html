<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI电子衣柜｜高保真交互 Demo V1.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
:root{
  --serif:"Songti SC","STSong","Noto Serif CJK SC","Times New Roman",serif;
  --fast:160ms;--normal:280ms;--slow:520ms;
  --neutral:#F7F5F1;--neutral-line:rgba(55,48,61,.11);
}
:root[data-theme="flow"]{
  --bg:#FAF8F5;--surface:#F4EFFB;--elev:#FFFFFF;
  --text:#302A3D;--muted:#756E80;--line:#E5DFF0;
  --accent:#7357D9;--accent2:#CDB8EE;--accent-soft:#EEE9FB;
  --on-accent:#FFFFFF;--star:#8E74BE;
  --shadow:0 12px 30px rgba(67,55,84,.08);
  --shadow-strong:0 20px 48px rgba(67,55,84,.14);
  --chrome:#FFFFFFD9;
  --body-bg:
    radial-gradient(circle at 14% 16%,rgba(205,184,238,.44),transparent 29%),
    radial-gradient(circle at 84% 20%,rgba(115,87,217,.12),transparent 22%),
    linear-gradient(145deg,#f6f1ff,#fffaf4 48%,#f4effb);
}
:root[data-theme="space"]{
  --bg:#0B0B0C;--surface:#171719;--elev:#222225;
  --text:#F1ECE6;--muted:#A8A29D;--line:#39342F;
  --accent:#D4B896;--accent2:#B89568;--accent-soft:#292117;
  --on-accent:#171719;--star:#D4B896;
  --shadow:0 0 0 1px #39342F;
  --shadow-strong:0 20px 54px rgba(0,0,0,.40);
  --chrome:#171719E8;
  --body-bg:
    radial-gradient(circle at 82% 10%,rgba(212,184,150,.18),transparent 25%),
    radial-gradient(circle at 12% 74%,rgba(184,149,104,.10),transparent 25%),
    linear-gradient(145deg,#090909,#12100f 48%,#070707);
}
body{
  background:var(--body-bg);color:var(--text);transition:background var(--slow) ease,color var(--slow) ease;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.demo-shell{width:min(414px,100%);position:relative}
.phone{
  width:390px;height:844px;max-width:100%;margin:auto;border-radius:42px;overflow:hidden;position:relative;
  background:var(--bg);border:1px solid color-mix(in srgb,var(--line) 76%,#fff 24%);
  box-shadow:0 28px 90px rgba(0,0,0,.34);transition:background var(--slow),border-color var(--slow);
}
@media(max-width:460px){
  body{padding:0;background:var(--bg)}
  .demo-shell,.phone{width:100%;height:100vh;min-height:760px;border-radius:0;border:0}
}
.amb{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.amb .glow{position:absolute;width:360px;height:360px;border-radius:50%;filter:blur(20px);opacity:.5;left:-150px;top:-130px;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 30%,transparent),transparent 68%);animation:drift 22s ease-in-out infinite alternate}
.amb .glow2{position:absolute;width:330px;height:330px;border-radius:50%;filter:blur(12px);opacity:.34;right:-150px;top:250px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%);animation:drift2 26s ease-in-out infinite alternate}
.amb .stars{position:absolute;inset:0;opacity:.34;background-image:
 radial-gradient(circle at 12% 12%,var(--star) 0 1px,transparent 1.4px),
 radial-gradient(circle at 79% 16%,var(--star) 0 .8px,transparent 1.2px),
 radial-gradient(circle at 64% 28%,var(--star) 0 .7px,transparent 1.1px),
 radial-gradient(circle at 30% 44%,var(--star) 0 .7px,transparent 1.1px),
 radial-gradient(circle at 88% 48%,var(--star) 0 .8px,transparent 1.2px),
 radial-gradient(circle at 18% 72%,var(--star) 0 .7px,transparent 1.1px),
 radial-gradient(circle at 70% 86%,var(--star) 0 .8px,transparent 1.2px);
 animation:breathe 8.7s ease-in-out infinite}
.orbit{position:absolute;border:1px solid color-mix(in srgb,var(--star) 25%,transparent);border-radius:50%;opacity:0;transition:opacity var(--slow)}
:root[data-theme="space"] .orbit{opacity:.42}
.orbit.o1{width:330px;height:150px;right:-180px;top:80px;transform:rotate(-18deg)}
.orbit.o2{width:270px;height:120px;left:-180px;bottom:90px;transform:rotate(22deg)}
@keyframes breathe{50%{opacity:.56}}
@keyframes drift{to{transform:translate(28px,24px) scale(1.04)}}
@keyframes drift2{to{transform:translate(-20px,30px) scale(1.03)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:0ms!important}}
.chrome,.stage,.tabbar{position:relative;z-index:2}
.status{
  height:34px;padding:10px 20px 0;display:flex;justify-content:space-between;align-items:center;
  font-size:11px;font-weight:700;color:var(--text)
}
.status-icons{display:flex;align-items:center;gap:5px}
.signal{width:14px;height:8px;display:flex;align-items:flex-end;gap:1px}
.signal i{display:block;width:2px;background:currentColor;border-radius:1px}.signal i:nth-child(1){height:3px}.signal i:nth-child(2){height:5px}.signal i:nth-child(3){height:7px}.signal i:nth-child(4){height:8px}
.battery{width:19px;height:9px;border:1.4px solid currentColor;border-radius:2px;position:relative}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 1px 1px 0}
.battery:before{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px}
.navbar{
  height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);backdrop-filter:blur(12px)
}
.navtitle{font-size:13px;font-weight:700;letter-spacing:.03em}
.iconbtn,.backbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--elev) 86%,transparent);
  color:var(--text);display:grid;place-items:center;cursor:pointer;font-size:18px
}
.stage{height:calc(100% - 34px - 52px - 66px);overflow-y:auto;scrollbar-width:none;padding:0 18px 26px}
.stage::-webkit-scrollbar{display:none}
.tabbar{
  height:66px;display:flex;align-items:flex-start;justify-content:space-around;padding:7px 18px 8px;
  background:var(--chrome);border-top:1px solid var(--line);backdrop-filter:blur(20px)
}
.tabbar button{border:0;background:none;color:var(--muted);font:600 10px inherit;cursor:pointer;min-width:72px;padding:3px 8px}
.tabbar button.on{color:var(--accent)}
.tabico{display:block;margin:auto auto 3px;width:21px;height:21px}
.screen{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}
.serif{font-family:var(--serif)}
.kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.h1{font:700 31px/1.12 var(--serif);letter-spacing:.015em;color:var(--text);margin:0}
.h2{font:700 24px/1.16 var(--serif);color:var(--text);margin:0}
.h3{font-size:16px;font-weight:800;margin:0}
.sub{font-size:12px;line-height:1.7;color:var(--muted)}
.card{background:color-mix(in srgb,var(--elev) 94%,transparent);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.panel{padding:15px}
.btn{border:0;border-radius:16px;height:48px;padding:0 18px;font:700 14px inherit;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 18%,transparent)}
.btn.sec{background:var(--elev);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.full{width:100%}
.sp8{height:8px}.sp10{height:10px}.sp12{height:12px}.sp14{height:14px}.sp16{height:16px}.sp18{height:18px}.sp20{height:20px}.sp24{height:24px}
.row{display:flex;align-items:center;gap:10px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{border:1px solid var(--line);background:var(--elev);color:var(--text);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--elev))}
.toast{
  position:absolute;left:50%;bottom:82px;z-index:50;transform:translate(-50%,8px);opacity:0;pointer-events:none;
  background:#171719;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;transition:.2s
}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* onboarding */
.welcome{padding:28px 2px 0;text-align:left}
.welcome-art{
  height:280px;margin:22px -2px 18px;border-radius:32px;border:1px solid var(--line);overflow:hidden;position:relative;
  background:
   radial-gradient(circle at 25% 24%,color-mix(in srgb,var(--accent2) 55%,transparent),transparent 24%),
   radial-gradient(circle at 68% 68%,color-mix(in srgb,var(--accent) 28%,transparent),transparent 27%),
   linear-gradient(150deg,color-mix(in srgb,var(--surface) 88%,transparent),var(--elev));
}
.wardrobe-door{position:absolute;left:58px;right:58px;top:35px;bottom:34px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:110px 110px 20px 20px}
.wardrobe-door:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid color-mix(in srgb,var(--accent) 28%,var(--line))}
.wardrobe-door:after{content:"✦";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:46px;color:var(--accent);text-shadow:0 0 26px color-mix(in srgb,var(--accent) 25%,transparent)}
.wardrobe-rail{position:absolute;left:86px;right:86px;top:108px;border-top:1px solid color-mix(in srgb,var(--accent) 34%,var(--line))}
.hanger{position:absolute;width:54px;height:48px;top:111px;border-bottom:1px solid var(--accent);border-radius:0 0 26px 26px;opacity:.55}
.hanger:before{content:"";position:absolute;left:50%;top:-15px;width:13px;height:16px;border:1px solid var(--accent);border-bottom:0;border-radius:10px 10px 0 0}
.hanger.h1{left:104px}.hanger.h2{right:104px;transform:scale(.92)}
.flowline{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--muted);letter-spacing:.05em}
.flowline b{color:var(--accent)}
.choice3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.upload-choice{padding:17px 4px 15px;text-align:center;cursor:pointer}
.upload-choice svg{width:28px;height:28px;color:var(--accent);margin-bottom:8px}
.upload-choice b{display:block;font-size:12px}
/* home */
.datebar{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:7px;margin-top:13px}
.datebar button{height:39px;border:1px solid var(--line);border-radius:13px;background:var(--elev);color:var(--text);font:700 11px inherit;cursor:pointer}
.datebar button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.weather{margin-top:10px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.sun{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent2) 22%,var(--elev));color:var(--accent);font-size:18px}
.wtemp{font-size:18px;font-weight:800}.wdesc{font-size:10px;color:var(--muted);line-height:1.5}
.wardrobe-row{margin-top:9px;padding:12px 14px;cursor:pointer}
.avatar-mini{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.play-head{margin:20px 0 8px}.play-head h2{font:700 21px var(--serif)}
.play-hint{font-size:10px;color:var(--muted);margin-top:4px}
.playviewport{margin:0 -18px;overflow:hidden;padding:8px 0 10px}
.playrail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 110px 8px;scrollbar-width:none}
.playrail::-webkit-scrollbar{display:none}
.playcard{
  flex:0 0 150px;height:205px;scroll-snap-align:center;border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--elev) 98%,transparent),color-mix(in srgb,var(--surface) 72%,transparent));
  position:relative;overflow:hidden;cursor:pointer;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease;user-select:none
}
.playcard.sel{transform:scale(1.075);border-color:color-mix(in srgb,var(--accent) 65%,var(--line));box-shadow:var(--shadow-strong)}
.playcard:before{content:"";position:absolute;left:18px;right:18px;top:0;border-top:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.hook{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:20px;height:20px;border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:50%;background:var(--bg)}
.play-art{height:112px;display:grid;place-items:center;position:relative}
.play-art .orb{width:70px;height:70px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));display:grid;place-items:center;color:var(--accent);font:700 30px var(--serif);background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 20%,transparent),transparent 68%)}
.play-art .tarot-mini{width:48px;height:72px;border-radius:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#372b5d),color-mix(in srgb,var(--accent) 46%,#1c1730));border:1px solid color-mix(in srgb,var(--accent2) 58%,transparent);color:#fff;display:grid;place-items:center;transform:rotate(-8deg);box-shadow:0 8px 18px rgba(0,0,0,.14)}
.play-art .battery{width:60px;height:31px;border:1.6px solid var(--accent);border-radius:8px;position:relative}
.play-art .battery:after{content:"";position:absolute;right:-6px;top:9px;width:5px;height:11px;background:var(--accent);border-radius:0 3px 3px 0}
.play-art .battery:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:62%;border-radius:4px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.playmeta{padding:0 13px 13px}.playname{font:700 16px var(--serif);margin-bottom:5px}.playdesc{font-size:10px;line-height:1.5;color:var(--muted)}
.plus-card{display:grid;place-items:center;text-align:center}.plus-card .plus{font:400 44px var(--serif);color:var(--accent)}
/* game picker */
.game-list{display:grid;gap:10px}
.game-row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--elev)}
.game-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--surface);color:var(--accent);font:700 20px var(--serif)}
.game-name{font-weight:800;font-size:13px}.game-desc{font-size:10px;line-height:1.55;color:var(--muted);margin-top:4px}
/* tarot */
.tarot-slots{display:flex;justify-content:center;gap:8px;min-height:78px;margin:4px 0 6px}
.pickslot{width:46px;height:70px;border-radius:9px;border:1px dashed var(--line);display:grid;place-items:center;font-size:9px;color:var(--muted);transition:.34s ease}
.pickslot.filled{border-style:solid;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 62%,#362c5f),color-mix(in srgb,var(--accent) 38%,#1b172c));color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.14)}
.pickslot.filled span{font-size:15px}
.twheel{position:relative;height:510px;overflow:hidden;touch-action:none;cursor:grab;margin-top:-8px}
.twheel.drag{cursor:grabbing}
.twheel:before{content:"";position:absolute;left:50%;top:50%;width:330px;height:330px;margin:-165px 0 0 -165px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 9%,transparent),transparent 68%)}
.tcard{position:absolute;left:0;top:0;width:166px;height:116px;border-radius:13px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 78%,#413778),color-mix(in srgb,var(--accent) 46%,#211b3c));border:1px solid color-mix(in srgb,var(--accent2) 55%,transparent);padding:11px 0 0 15px;color:#eae6ff;box-shadow:0 4px 13px rgba(0,0,0,.18);will-change:transform}
:root[data-theme="space"] .tcard{background:linear-gradient(180deg,#584632,#241d17);color:#f6e6cf}
.tcard.pick{outline:2px solid #EBCB91;outline-offset:2px;box-shadow:0 0 22px rgba(235,203,145,.35);z-index:30}
.tcard.taken{opacity:.06}
.tcard b{font-size:12px}.tcard i{font-style:normal;color:#EBCB91;margin-right:8px}
.tmid{position:absolute;pointer-events:none;z-index:40;width:8px;height:8px;border-radius:50%;background:#EBCB91;box-shadow:0 0 12px rgba(235,203,145,.8)}
.reveal-overlay{position:absolute;inset:34px 14px 74px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reveal-row{display:flex;gap:9px}
.flipcard{width:88px;height:138px;perspective:800px}
.flipinner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.flipcard.on .flipinner{transform:rotateY(180deg)}
.flipface{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.flipback{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 72%,#362c5f),color-mix(in srgb,var(--accent) 42%,#1c1730));color:#fff}
.flipfront{transform:rotateY(180deg);background:var(--elev);color:var(--text)}
.flipfront b{font:700 14px var(--serif)}.flipfront span{font-size:9px;color:var(--muted);margin-top:5px}
/* energy */
.energy-wrap{text-align:center;padding-top:14px}
.energy-number{font:700 76px/.95 var(--serif);color:var(--accent);letter-spacing:-.06em}
.energy-range{margin-top:30px}
input[type=range]{width:100%;accent-color:var(--accent)}
.energy-track-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:8px}
.energy-echo{margin:18px auto 0;max-width:270px;font-size:12px;line-height:1.75;color:var(--muted)}
/* identity */
.catbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:13px -18px 0;padding:0 18px 8px}
.catbar::-webkit-scrollbar{display:none}
.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.rolecard{padding:15px;border:1px solid var(--line);border-radius:19px;background:var(--elev);text-align:left;cursor:pointer;min-height:142px;position:relative;overflow:hidden}
.rolecard.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 9%,transparent)}
.rolecard:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-32px;bottom:-35px;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 32%,transparent),transparent 70%)}
.rolename{font:700 18px var(--serif);margin-bottom:8px}.rolekw{font-size:10px;line-height:1.55;color:var(--muted)}
/* input */
.prompt-field{display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 13px}
.prompt-field textarea{border:0;background:transparent;color:var(--text);font:inherit;resize:none;outline:0;min-height:48px;max-height:96px;flex:1}
.prompt-field button{flex:none;height:40px;border:0;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:0 15px;cursor:pointer}
.examples{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:0 18px}
.examples::-webkit-scrollbar{display:none}
.readchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.closet-band{margin:18px -18px 0;padding:14px 18px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 48%,transparent)}
.band-title{font-size:10px;color:var(--muted);margin-bottom:8px}
.band-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.band-row::-webkit-scrollbar{display:none}
.banditem{flex:0 0 54px;width:54px;height:62px;border-radius:14px;background:var(--neutral);border:1px solid var(--neutral-line);overflow:hidden;position:relative}
.banditem img{width:100%;height:100%;object-fit:cover;display:block}
.flyclone{position:fixed;z-index:9999;border-radius:14px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.2);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
/* results */
.source-strip{height:34px;display:flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:10px;font-weight:800;margin-bottom:10px}
.source-strip i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.outfit-carousel{position:relative;touch-action:pan-y}
.outfit-frame{border-radius:25px;background:var(--neutral);border:1px solid var(--neutral-line);padding:12px;color:#302A3D;overflow:hidden}
.of-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.of-source{font-size:9px;font-weight:800;border-radius:999px;padding:5px 8px;background:#fff;border:1px solid rgba(0,0,0,.08);color:#514a56}
.of-source.ai{background:#302A3D;color:#fff}
.of-name{font:700 18px var(--serif);margin-top:7px}
.outfit-board{display:grid;grid-template-columns:1.2fr .8fr;gap:8px;margin-top:10px}
.outfit-main,.outfit-small{background:white;border:1px solid rgba(0,0,0,.055);border-radius:17px;overflow:hidden;position:relative}
.outfit-main{grid-row:span 2;height:285px}.outfit-small{height:138px}
.outfit-main img,.outfit-small img{width:100%;height:100%;object-fit:cover;display:block}
.ai-full{height:316px;border-radius:18px;overflow:hidden;margin-top:10px;background:#fff}
.ai-full img{width:100%;height:100%;object-fit:cover;display:block}
.of-arrows{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 2px}
.circlebtn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--elev);color:var(--text);cursor:pointer}
.dots{display:flex;gap:5px}.dot{width:6px;height:6px;border-radius:99px;background:var(--line)}.dot.on{width:17px;background:var(--accent)}
.reason{margin-top:12px;padding:15px}.reason p{font-size:11px;line-height:1.85;color:var(--muted);margin:0}
.tarot-explain{margin-top:12px}
.fanmini{display:flex;justify-content:center;gap:0;height:114px;position:relative}
.fanmini .mini{width:70px;height:105px;border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#372d62),color-mix(in srgb,var(--accent) 42%,#1c1730));border:1px solid color-mix(in srgb,var(--accent2) 55%,transparent);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 8px 20px rgba(0,0,0,.18);margin-left:-10px}
.fanmini .mini:nth-child(1){transform:rotate(-8deg) translateY(6px)}.fanmini .mini:nth-child(3){transform:rotate(8deg) translateY(6px)}
.fanmini b{font:700 13px var(--serif)}.fanmini span{font-size:8px;margin-top:5px;opacity:.8}
/* wardrobe */
.filterbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:0 18px 8px}
.filterbar::-webkit-scrollbar{display:none}
.wardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.warditem{border:1px solid var(--line);border-radius:16px;background:var(--elev);overflow:hidden;text-align:left;cursor:pointer;padding:0}
.wardimg{aspect-ratio:.82;background:var(--neutral);overflow:hidden}.wardimg img{width:100%;height:100%;object-fit:cover}
.wardmeta{padding:8px}.wardmeta b{font-size:10px}.wardmeta span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
/* me */
.cover{height:222px;margin:0 -18px 0;position:relative;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--accent2) 36%,var(--surface)),var(--surface))}
.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.62),transparent 65%)}
.profile{position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#fff;display:flex;gap:11px;align-items:flex-end}
.avatar{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.9);overflow:hidden;background:linear-gradient(135deg,#ddd1ef,#8c75b8)}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile b{font:700 19px var(--serif)}.profile p{font-size:10px;margin:4px 0 0;opacity:.88}
.cover .gear{position:absolute;right:14px;top:14px;z-index:3}
.quick2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}
.quick{padding:13px;text-align:left;cursor:pointer}.quick b{font-size:12px}.quick span{display:block;font-size:9px;color:var(--muted);margin-top:4px}
.posts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.post{aspect-ratio:.82;border-radius:15px;overflow:hidden}.post img{width:100%;height:100%;object-fit:cover}
.settings-list{display:grid;gap:9px;margin-top:12px}.setrow{padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--elev);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}.tabs button{height:39px;border:1px solid var(--line);border-radius:12px;background:var(--elev);color:var(--text);font:700 11px inherit;cursor:pointer}.tabs button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.record{padding:13px;border:1px solid var(--line);border-radius:17px;background:var(--elev);margin-bottom:9px;cursor:pointer}
/* sheet/modal */
.mask{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;padding:12px}
.sheet{width:100%;border-radius:26px;background:var(--elev);border:1px solid var(--line);padding:16px;box-shadow:0 28px 70px rgba(0,0,0,.32)}
.trendpic{height:180px;border-radius:19px;overflow:hidden;position:relative;background:#ddd}.trendpic img{width:100%;height:100%;object-fit:cover}.trendpic:after{content:"当季新品灵感";position:absolute;left:14px;bottom:12px;color:#fff;font:700 16px var(--serif);text-shadow:0 2px 8px rgba(0,0,0,.45)}
</style>
</head>

 geom();layout();

 });
}

 const sets=resultSets();if(S.resultIndex>=sets.length)S.resultIndex=0;const set=sets[S.resultIndex];
 let board='';
 if(set.source==='ai'){board=`<div class="ai-full"><img src="${A(set.full)}" alt="AI 参考穿搭"></div>`}
 else board=`<div class="outfit-board"><div class="outfit-main"><img src="${A(set.imgs[0])}" alt=""></div><div class="outfit-small"><img src="${A(set.imgs[1])}" alt=""></div><div class="outfit-small"><img src="${A(set.imgs[2])}" alt=""></div></div>`;
 return `<div class="outfit-carousel" data-kind="${kind}"><div class="outfit-frame"><div class="of-head"><div><span class="of-source ${set.source==='ai'?'ai':''}">${set.source==='ai'?'AI 推荐参考 · 非我的衣柜':'来自我的衣柜'}</span><div class="of-name">${set.name}</div></div><span style="font-size:9px;color:#746d79">${S.resultIndex+1}/${sets.length}</span></div>${board}</div>
 ${sets.length>1?`<div class="of-arrows"><button class="circlebtn" data-prev>‹</button><div class="dots">${sets.map((_,i)=>`<i class="dot ${i===S.resultIndex?'on':''}"></i>`).join('')}</div><button class="circlebtn" data-next>›</button></div>`:''}
 <div class="card reason"><h3 class="h3">为什么是这一套</h3><div class="sp8"></div><p>${reasonText(kind)}</p>${set.source==='ai'?`<div class="sp10"></div><div class="sub">这套只提供完整搭配参考，不假装你已经拥有这些单品。</div>`:''}</div>
 <div class="sp14"></div>${set.source==='ai'?`<button class="btn pri full" data-reference>参考这套</button>`:`<button class="btn pri full" data-confirm="${kind}">就穿这套</button>`}</div>`;
}
function renderResult(){
 const kind=S.resultKind||'energy';setChrome(kind==='tarot'?'塔罗结果':kind==='energy'?'社交电量结果':'身份结果',true);
 const extra=kind==='tarot'?tarotExplain():'';
 return `<div class="screen" style="padding-top:12px"><div class="source-strip"><i></i>${resultStrip(kind)}</div>${outfitBlock(kind)}${extra}</div>`;
}
function tarotExplain(){
 return `<div class="tarot-explain"><div class="sp16"></div><h3 class="h3">塔罗 + 穿搭解读</h3><div class="sp10"></div><div class="fanmini">${S.tarotPicked.map(p=>`<div class="mini"><b>${p.card[1]}${p.rev?' · 逆':''}</b><span>${p.card[2].slice(0,2).join(' · ')}</span></div>`).join('')}</div><div class="card reason"><p>牌给你的方向是：${S.tarotPicked.map(p=>p.card[2][0]).join('、')}。所以穿搭先保持整体美观与可穿，再把这些关键词放进视觉强弱和结构关系里。</p></div></div>`;
}
function renderWardrobe(){
 setChrome('我的衣柜',false);
 const imgs=['purple_blouse.png','cream_blouse.png','blue_dress.png','beige_bag.png','blue_jeans.png','white_shoes.png'];
 const names=['雾紫衬衫','奶油白衬衫','雾蓝连衣裙','米色手袋','蓝色牛仔裤','奶油白运动鞋'];
 return `<div class="screen" style="padding-top:14px"><div class="between"><div><div class="kicker">MY WARDROBE</div><div class="sp5"></div><h2 class="h2">我的衣柜</h2></div><button class="iconbtn" data-go="add">＋</button></div>
 <div class="filterbar"><span class="chip on">全部</span><span class="chip">上装</span><span class="chip">下装</span><span class="chip">外套</span><span class="chip">连衣裙</span></div>
 ${S.wardrobeReady?`<div class="wardgrid">${imgs.map((x,i)=>`<button class="warditem" data-go="garment"><div class="wardimg"><img src="${A(x)}"></div><div class="wardmeta"><b>${names[i]}</b><span>${i<2?'上装':i===2?'连衣裙':i===3?'包袋':i===4?'下装':'鞋履'}</span></div></button>`).join('')}</div>`:`<div class="sp18"></div><div class="card panel"><b style="font-size:12px">你的衣柜还是空的</b><p class="sub" style="margin-top:6px">玩法仍然能跑，但只会给 AI 参考穿搭。</p><div class="sp12"></div><button class="btn pri full" data-go="add">添加第一件衣服</button></div>`}
 </div>`;
}
function renderGarment(){
 setChrome('单品详情',true);
 return `<div class="screen" style="padding-top:15px"><div class="outfit-frame"><div class="ai-full" style="height:360px"><img src="${A('purple_blouse.png')}" style="object-fit:cover"></div></div><div class="sp14"></div><h2 class="h2">雾紫衬衫</h2><div class="readchips"><span class="chip on">上装</span><span class="chip">雾紫</span><span class="chip">简约</span><span class="chip">春秋</span></div><div class="sp18"></div><button class="btn sec full">编辑基础信息</button></div>`;
}
function todayOutfit(){return S.confirmed[ymd(today)]}
function renderMe(){
 setChrome('',false);const has=!!todayOutfit();const bg=has?A('ai_outfit_model.png'):null;
 return `<div class="screen"><div class="cover">${bg?`<img src="${bg}" alt="">`:''}<button class="iconbtn gear" data-go="settings">⚙</button><div class="profile"><div class="avatar"><img src="${A('profile1.png')}"></div><div><b>${S.profile.name}</b><p>${S.profile.bio}</p></div></div></div>
 <div class="quick2"><button class="card quick" data-go="wardrobe"><b>我的衣橱</b><span>${S.wardrobeCount} 件单品</span></button><button class="card quick" data-go="records"><b>穿搭记录</b><span>历史 / 未来</span></button></div>
 <div class="between"><h3 class="h3">我发布过的帖子</h3><span class="sub">广场</span></div><div class="posts">${['profile1.png','profile2.png','profile3.png','profile4.png'].map(x=>`<div class="post"><img src="${A(x)}"></div>`).join('')}</div></div>`;
}
function renderSettings(){
 setChrome('设置',true);
 return `<div class="screen" style="padding-top:12px"><div class="settings-list"><button class="setrow" data-go="profile"><span>个人信息</span><span>›</span></button><button class="setrow" data-go="theme"><span>主题设置</span><span>›</span></button><button class="setrow"><span>账号与隐私</span><span class="sub">Demo</span></button><button class="setrow"><span>关于</span><span class="sub">V1.3</span></button></div><div class="sp20"></div><button class="btn ghost full" data-reset>重置 Demo</button></div>`;
}
function renderTheme(){
 setChrome('主题设置',true);
 return `<div class="screen" style="padding-top:15px"><h2 class="h2">选择界面主题</h2><p class="sub" style="margin-top:6px">主题只改变 UI，不改变穿搭推荐。</p><div class="settings-list"><button class="setrow" data-theme="system"><span>跟随系统</span><b>${S.theme==='system'?'✓':''}</b></button><button class="setrow" data-theme="flow"><span>流光 · 雾紫</span><b>${S.theme==='flow'?'✓':''}</b></button><button class="setrow" data-theme="space"><span>深空 · 黑金</span><b>${S.theme==='space'?'✓':''}</b></button></div></div>`;
}
function renderProfile(){
 setChrome('个人信息',true);
 return `<div class="screen" style="padding-top:14px"><label class="sub">昵称</label><div class="sp6"></div><input id="pname" value="${S.profile.name}" style="width:100%;height:46px;border:1px solid var(--line);border-radius:14px;background:var(--elev);color:var(--text);padding:0 12px;font:inherit"><div class="sp14"></div><label class="sub">个人介绍</label><div class="sp6"></div><textarea id="pbio" style="width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;background:var(--elev);color:var(--text);padding:12px;font:inherit">${S.profile.bio}</textarea><div class="sp18"></div><button class="btn pri full" data-save-profile>保存</button></div>`;
}
function renderRecords(){
 setChrome('穿搭记录',true);const now=ymd(today);const arr=Object.entries(S.confirmed).map(([date,v])=>({date,...v})).sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>S.recordTab==='history'?x.date<now:x.date>=now);
 return `<div class="screen" style="padding-top:10px"><div class="tabs"><button data-tab="history" class="${S.recordTab==='history'?'on':''}">历史记录</button><button data-tab="future" class="${S.recordTab==='future'?'on':''}">未来穿搭</button></div>${arr.length?arr.map(x=>`<div class="record" data-record="${x.date}"><div class="between"><b style="font-size:12px">${x.date===now?'今天':x.date}</b><span class="chip">${x.kind}</span></div><div class="sub" style="margin-top:5px">${x.name}</div></div>`).join(''):`<div class="card panel"><b style="font-size:12px">这里还没有记录</b><p class="sub" style="margin-top:6px">在玩法结果里点击“就穿这套”，会自动进入对应日期。</p></div>`}</div>`;
}
function renderRecord(){
 const x=S.confirmed[S.recordDate];if(!x)return renderRecords();setChrome('穿搭详情',true);return `<div class="screen" style="padding-top:10px"><div class="source-strip"><i></i>${S.recordDate} · ${x.kind}</div><div class="outfit-frame"><div class="ai-full"><img src="${A('ai_outfit_model.png')}"></div></div><div class="card reason"><h3 class="h3">为什么是这一套</h3><div class="sp8"></div><p>${x.reason}</p></div></div>`;
}
function render(){
 applyTheme();
 let out='';
 if(S.route==='welcome')out=renderWelcome();else if(S.route==='why')out=renderWhy();else if(S.route==='add')out=renderAdd();else if(S.route==='recognize')out=renderRecognize();else if(S.route==='done')out=renderDone();else if(S.route==='home')out=renderHome();else if(S.route==='games')out=renderGames();
 else if(S.route==='tarot')out=renderTarot();else if(S.route==='energy')out=renderEnergy();else if(S.route==='identity')out=renderIdentity();else if(S.route==='input')out=renderInput();else if(S.route==='result')out=renderResult();
 else if(S.route==='wardrobe')out=renderWardrobe();else if(S.route==='garment')out=renderGarment();else if(S.route==='me')out=renderMe();else if(S.route==='settings')out=renderSettings();else if(S.route==='theme')out=renderTheme();else if(S.route==='profile')out=renderProfile();else if(S.route==='records')out=renderRecords();else if(S.route==='record')out=renderRecord();else{S.route='home';out=renderHome()}
 $('#stage').innerHTML=out;bind();
 if(S.route==='home'&&!S.trendSeen){S.trendSeen=true;save();setTimeout(showTrend,550)}
 if(S.route==='tarot'&&S.tarotPicked.length<3)mountTarotWheel();
 if(S.route==='home')setTimeout(syncHomeCard,40);
}
function showTrend(){
 if(S.route!=='home')return;
 modal(`<div class="between"><div><div class="kicker">SEASON EDIT</div><h3 class="h3">当季新品穿搭</h3></div><button class="iconbtn" data-close>×</button></div><div class="sp12"></div><div class="trendpic"><img src="${A('ai_outfit_model.png')}"></div><div class="sp10"></div><p class="sub">这一栏只看当季趋势和市场新品，不使用你的历史穿搭习惯。</p><div class="sp12"></div><button class="btn sec full" data-close>知道了</button>`);
}
function syncHomeCard(){
 const rail=$('#playrail');if(!rail)return;const cards=$$('[data-home-game]',rail);const c=cards[S.homeSelected];if(c)c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})
}
function bind(){
 $('#backBtn').onclick=back;$('#navRight').onclick=()=>{if(S.route==='home')go('games')};
 $$('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.root,false));
 $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 $$('[data-skip]').forEach(b=>b.onclick=()=>{S.onboardDone=true;save();go('home')});
 $$('[data-upload]').forEach(b=>b.onclick=()=>go('recognize'));
 $('[data-confirm-clothes]')?.addEventListener('click',()=>{S.wardrobeReady=true;S.wardrobeCount=12;save();go('done')});
 $('[data-finish]')?.addEventListener('click',()=>{S.onboardDone=true;save();go('home')});
 $$('[data-target]').forEach(b=>b.onclick=()=>{S.target=b.dataset.target;S.resultIndex=0;save();render()});
 $('[data-pick-date]')?.addEventListener('click',()=>{const d=addDays(today,3);S.target='date:'+ymd(d);save();render();t('已选 '+fmt(d))});
 let lp=null;
 $$('[data-home-game]').forEach(card=>{
   const id=card.dataset.homeGame,idx=+card.dataset.index;
   card.addEventListener('pointerdown',()=>{lp=setTimeout(()=>{S.homeGames=S.homeGames.filter(x=>x!==id);S.homeSelected=Math.max(0,Math.min(S.homeSelected,S.homeGames.length-1));save();render();t('已从首页移除 '+games[id].name);lp=null},650)});
   const up=()=>{if(lp){clearTimeout(lp);lp=null;if(S.homeSelected!==idx){S.homeSelected=idx;save();render()}else go(id)}};
   card.addEventListener('pointerup',up);card.addEventListener('pointercancel',()=>{if(lp){clearTimeout(lp);lp=null}});card.addEventListener('pointerleave',()=>{if(lp){clearTimeout(lp);lp=null}});
 });
 $('#playrail')?.addEventListener('scroll',()=>{clearTimeout(bind._hs);bind._hs=setTimeout(()=>{const rail=$('#playrail'),cards=$$('[data-home-game]',rail);if(!cards.length)return;const rc=rail.getBoundingClientRect(),cx=(rc.left+rc.right)/2;let bi=0,bv=1e9;cards.forEach((c,i)=>{const r=c.getBoundingClientRect(),v=Math.abs((r.left+r.right)/2-cx);if(v<bv){bv=v;bi=i}});if(bi!==S.homeSelected){S.homeSelected=bi;save();cards.forEach((c,i)=>c.classList.toggle('sel',i===bi))}},90)});
 $$('[data-toggle-game]').forEach(b=>b.onclick=()=>{const id=b.dataset.toggleGame;if(S.homeGames.includes(id))S.homeGames=S.homeGames.filter(x=>x!==id);else S.homeGames.push(id);save();render()});
 const er=$('#erange');if(er)er.oninput=e=>{S.energy=+e.target.value;$('#enum').textContent=S.energy;$('#ecopy').textContent=energyCopy(S.energy);save()};
 $('[data-energy-result]')?.addEventListener('click',()=>{S.resultKind='energy';S.resultIndex=0;save();go('result')});
 $$('[data-cat]').forEach(b=>b.onclick=()=>{S.identityGroup=b.dataset.cat;S.identity=identityGroups[S.identityGroup][0];save();render()});
 $$('[data-role]').forEach(b=>b.onclick=()=>{S.identity=b.dataset.role;save();render()});
 $('[data-identity-result]')?.addEventListener('click',()=>{S.resultKind='identity';S.resultIndex=0;save();go('result')});
 $$('[data-example]').forEach(b=>b.onclick=()=>{S.inputText=b.dataset.example;S.inputChips=[];S.inputDone=false;save();render()});
 $('[data-parse]')?.addEventListener('click',()=>{const q=$('#prompt').value.trim();if(!q){t('先输入一句话');return}S.inputText=q;S.inputChips=parseInput(q);S.inputDone=false;save();render()});
 $('[data-clear-input]')?.addEventListener('click',()=>{S.inputChips=[];S.inputDone=false;save();render()});
 $('[data-run-input]')?.addEventListener('click',()=>{runInputFly()});
 $('[data-redo-input]')?.addEventListener('click',()=>{S.inputDone=false;S.inputChips=[];save();render()});
 $$('[data-prev]').forEach(b=>b.onclick=()=>{const sets=resultSets();S.resultIndex=(S.resultIndex-1+sets.length)%sets.length;save();render()});
 $$('[data-next]').forEach(b=>b.onclick=()=>{const sets=resultSets();S.resultIndex=(S.resultIndex+1)%sets.length;save();render()});
 $$('.outfit-carousel').forEach(el=>{let sx=0,down=false;el.addEventListener('pointerdown',e=>{down=true;sx=e.clientX});el.addEventListener('pointerup',e=>{if(!down)return;down=false;const dx=e.clientX-sx;if(Math.abs(dx)<42)return;const sets=resultSets();S.resultIndex=(S.resultIndex+(dx<0?1:-1)+sets.length)%sets.length;save();render()})});
 $$('[data-confirm]').forEach(b=>b.onclick=()=>confirmOutfit(b.dataset.confirm));
 $$('[data-reference]').forEach(b=>b.onclick=()=>t('已记下这套参考思路'));
 $$('[data-theme]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;save();applyTheme();render()});
 $('[data-save-profile]')?.addEventListener('click',()=>{S.profile.name=$('#pname').value.trim()||'小鹿';S.profile.bio=$('#pbio').value.trim();save();go('me')});
 $('[data-reset]')?.addEventListener('click',()=>{
 const m=modal(`<h3 class="h3">重置 Demo？</h3><p class="sub" style="margin-top:8px">会清空衣柜、穿搭记录和首页玩法设置。</p><div class="sp14"></div><div class="row"><button class="btn sec" style="flex:1" data-close>取消</button><button class="btn pri" style="flex:1" id="doReset">重置</button></div>`);
 $('#doReset',m).onclick=()=>{S={...stateDefault};save();m.remove();render()};
});
 $$('[data-tab]').forEach(b=>b.onclick=()=>{S.recordTab=b.dataset.tab;save();render()});
 $$('[data-record]').forEach(b=>b.onclick=()=>{S.recordDate=b.dataset.record;go('record')});
}
function runInputFly(){
 const chosen=$$('[data-band]').slice(0,4);chosen.forEach((el,i)=>{const r=el.getBoundingClientRect(),cl=el.cloneNode(true);cl.className='flyclone';cl.style.left=r.left+'px';cl.style.top=r.top+'px';cl.style.width=r.width+'px';cl.style.height=r.height+'px';document.body.appendChild(cl);requestAnimationFrame(()=>{cl.style.transform=`translate(${(window.innerWidth/2-r.left-27)+(i-1.5)*42}px,${-220-i*14}px) scale(${1.2-i*.05}) rotate(${(i-1.5)*3}deg)`;cl.style.opacity='.12'});setTimeout(()=>cl.remove(),850)});setTimeout(()=>{S.inputDone=true;S.resultKind='input';S.resultIndex=0;save();render()},650)
}
function confirmOutfit(kind){
 const sets=resultSets(),set=sets[S.resultIndex];if(set.source==='ai'){t('AI 参考不能直接记为“已穿”');return}
 const d=ymd(targetDate());const commit=()=>{S.confirmed[d]={kind:kind==='tarot'?'塔罗':kind==='energy'?'社交电量':kind==='identity'?'身份':'跃然搭配',name:set.name,reason:reasonText(kind)};save();t('已安排到 '+targetLabel()+' ✓');render()};
 if(S.confirmed[d]){const m=modal(`<h3 class="h3">这一天已经有一套穿搭</h3><p class="sub" style="margin-top:8px">按日期一天只保留一套正式确定穿搭。要覆盖吗？</p><div class="sp14"></div><div class="row"><button class="btn sec" style="flex:1" data-close>取消</button><button class="btn pri" style="flex:1" id="overwrite">覆盖</button></div>`);$('#overwrite',m).onclick=()=>{m.remove();commit()}}else commit()
}
render();
</script>
</body>
</html>
